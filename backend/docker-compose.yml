version: '3.8'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: smallbiz
      POSTGRES_USER: smallbiz
      POSTGRES_PASSWORD: smallbiz_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smallbiz"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
